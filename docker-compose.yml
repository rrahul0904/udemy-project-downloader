services:
  course-intelligence:
    build: .
    container_name: udemy-project-downloader
    init: true
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      APP_USER: ${APP_USER:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      JOB_RATE_LIMIT_PER_MINUTE: ${JOB_RATE_LIMIT_PER_MINUTE:-5}
      MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-0}
      DOWNLOAD_DIR: /downloads
      DATA_DIR: /app/data
    volumes:
      - ./downloads:/downloads
      - ./data:/app/data
    restart: unless-stopped

  # On-demand worker: uses the same bound downloads/data as the web app.
  # Does not start during docker compose up (profile-gated).
  transcript-worker:
    profiles: ["transcribe"]
    build:
      context: .
      args:
        INSTALL_LOCAL_ASR: "1"
    image: udemy-project-downloader-transcriber:local
    init: true
    environment:
      APP_ENV: development
      DOWNLOAD_DIR: /downloads
      DATA_DIR: /app/data
      HF_HOME: /app/data/.cache/huggingface
      XDG_CACHE_HOME: /app/data/.cache
    volumes:
      - ./downloads:/downloads
      - ./data:/app/data
    restart: "no"
    command: ["python", "scripts/video_to_learning_poc.py", "--help"]
